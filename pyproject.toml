[project]
name = "lakehouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nasser", email = "kiti.nasser@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.47.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "dbt-core>=1.12.6",
    "dbt-databricks>=1.10.9",
    "pyspark>=4.2.0",
    "sqlfmt>=0.0.3",
    "pendulum>=2.1.2",
    "apache-airflow>=3.3.0",
    "apache-airflow-providers-databricks",
]


[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
