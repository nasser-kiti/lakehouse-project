resources:
  jobs:
    lakehouse_pipeline:
      name: lakehouse_pipeline

      parameters:
        - name: ingest_date
          default: ""

      tasks:
        - task_key: load_bronze
          environment_key: default
          python_wheel_task:
            package_name: lakehouse
            entry_point: load-bronze
            parameters: ["--ingest-date", "{{job.parameters.ingest_date}}"]

        - task_key: load_silver
          depends_on:
            - task_key: load_bronze
          environment_key: dbt
          dbt_task:
            project_directory: ../dbt
            source: WORKSPACE
            warehouse_id: "${var.warehouse_id}"
            catalog: lakehouse_one
            schema: silver
            commands:
              - "dbt build --select source:bronze path:models/silver"

        - task_key: load_gold
          depends_on:
            - task_key: load_silver
          environment_key: dbt
          dbt_task:
            project_directory: ../dbt
            source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
            catalog: lakehouse_one
            schema: gold
            commands:
              - "dbt build --select path:models/gold"

      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl
        - environment_key: dbt
          spec:
            environment_version: "6"
            dependencies:
              - dbt-databricks>=1.10.9,<2.0